run_name: nanofold_v1
track: limited
seed: 0

submission:
  path: submission.py

data:
  processed_features_dir: data/processed_features
  processed_labels_dir: data/processed_labels
  train_manifest: data/manifests/train.txt
  val_manifest: data/manifests/val.txt
  crop_size: 256
  msa_depth: 192
  batch_size: 1
  num_workers: 2
  train_crop_mode: random
  val_crop_mode: center
  train_msa_sample_mode: random
  val_msa_sample_mode: top

model:
  d_single: 128
  d_pair: 64
  n_pairformer_blocks: 8
  thinker_steps: 4
  d_workspace: 160
  k_tokens: 16
  d_tok: 64

optim:
  lr: 1.0e-4
  weight_decay: 1.0e-2
  grad_clip_norm: 1.0

train:
  max_steps: 30000
  log_every: 50
  eval_every: 500
  save_every: 500
  grad_accum_steps: 8
  amp: false
