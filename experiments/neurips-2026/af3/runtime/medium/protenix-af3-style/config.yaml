schema_version: 1
experiment_name: protenix-af3-style-nanofold-medium-random-init
upstream:
  repository: https://github.com/bytedance/Protenix
  commit: c3bfc365b3e1341a11935eddfe7bfdc308092147
model:
  upstream_variant: protenix_base_default_v1.0.0
  naming: AF3-style Protenix reconstruction
  random_initialization: true
  pairformer_blocks: 4
  training_recycles_max: 4
  crop_size: 256
  diffusion_batch_size: 48
  symmetric_atom_matching:
    source: pinned_protenix_ccd
    mini_rollout_labels: enabled
    diffusion_samples: upstream_default_log_only
  scaling_profile: medium
  width_scaling:
    c_s: 64
    c_z: 32
    c_atom: 32
    c_atompair: 4
    c_token: 64
    c_s_inputs: 129
    n_blocks: 4
    model:
      input_embedder:
        c_atom: 32
        c_atompair: 4
        c_token: 64
      relative_position_encoding:
        c_z: 32
      template_embedder:
        c_z: 32
      msa_module:
        c_z: 32
        c_s_inputs: 129
        c_m: 32
        n_blocks: 1
      pairformer:
        c_z: 32
        c_s: 64
        n_heads: 4
        n_blocks: 4
      diffusion_module:
        c_atom: 32
        c_atompair: 4
        c_token: 128
        c_s: 64
        c_z: 32
        c_s_inputs: 129
        atom_encoder:
          n_blocks: 1
        transformer:
          n_blocks: 4
          n_heads: 4
        atom_decoder:
          n_blocks: 1
      confidence_head:
        c_z: 32
        c_s: 64
        c_s_inputs: 129
        n_blocks: 4
      distogram_head:
        c_z: 32
      constraint_embedder:
        c_constraint_z: 32
        c_constraint_s: 129
        c_constraint_atom_pair: 4
  expected_total_parameters: 2773243
  expected_trainable_parameters_after_template_freeze: 2761453
inputs:
  train_manifest_count: 10000
  validation_manifest_count: 1000
  msa_depth: 192
  templates: false
  esm_embeddings: false
  pretrained_weights: false
distributed:
  nodes: 1
  processes_per_node: 8
  gpu_target: H100
  samples_per_optimizer_step: 8
  optimizer_steps: 30000
  matched_samples: 240000
optimization:
  implementation: pinned_protenix_helpers
  optimizer: Adam
  learning_rate: 0.0018
  beta1: 0.9
  beta2: 0.95
  weight_decay: 1.0e-08
  scheduler: AlphaFold3LRScheduler
  warmup_steps: 10
  decay_every_n_steps: 50000
  decay_factor: 0.95
  gradient_clip_norm: 10
precision:
  model_forward: bf16_autocast
  protenix_loss: fp32_autocast_disabled
inference:
  default_seed: 20260725
  default_diffusion_steps: 200
  default_diffusion_samples: 1
  default_model_seeds: 1
  default_mc_dropout_apply_rate: 0.0
  target_files_accessed: false
checkpointing:
  ema: false
  save_every_completed_steps: 250
  milestone_every_completed_steps: 3000
  recent_non_milestones_kept: 2
  latest_pointer: latest.json
  atomic_replace: true
  sha256: true
  expected_allocated_gib: 6
  explicit_run_budget_gib: 100
  allocated_byte_reserve_gib: 20
diagnostics:
  eight_chain_overfit:
    selection: verified_train_manifest_prefix
    scheduled_train_count: 8
    full_dataset_verified_first: true
    optimizer_steps: 200
    crop_size: 64
    msa_depth: 32
    save_initial_completed_step_zero: true
    claim_eligible: false
    pass_gate: fixed_seed_checkpoint_zero_vs_final_foldscore
effective_batch_execution:
  samples_per_optimizer_step: 8
  supported_physical_world_sizes:
  - 1
  - 2
  - 4
  - 8
  logical_rank_mapping: physical_rank + microbatch_index * physical_world_size
  resume_requires_same_physical_world: true
operational_layout:
  revision: 1
  diffusion_training_draws: 48
  diffusion_chunk_size: 48
  diffusion_lddt_chunk_size: 48
  activation_checkpoint_blocks: null
  use_fine_grained_checkpoint: false
  selection: fastest qualified timing-only layout; same scientific objective and random
    draws
  qualification_reference: operational-throughput-rev1/contract.json
